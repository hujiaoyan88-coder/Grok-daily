    // ========== 状態管理 ==========
    let data = {};          // { "YYYY-MM-DD": { word: true, book: false, ... } }
    let fullClearDates = []; // ["YYYY-MM-DD", ...]
    let calYear, calMonth;

    function getTodayKey() {
      const d = new Date();
      return d.getFullYear() + "-" +
             String(d.getMonth()+1).padStart(2,"0") + "-" +
             String(d.getDate()).padStart(2,"0");
    }

    function loadData() {
      try {
        data = JSON.parse(localStorage.getItem("grokDailyMissions") || "{}");
        fullClearDates = JSON.parse(localStorage.getItem("grokFullClearDates") || "[]");
      } catch(e) {
        data = {};
        fullClearDates = [];
      }
      const today = getTodayKey();
      if (!data[today]) {
        data[today] = {};
        MISSIONS.forEach(m => data[today][m.id] = false);
      }
    }

    function saveData() {
      localStorage.setItem("grokDailyMissions", JSON.stringify(data));
      localStorage.setItem("grokFullClearDates", JSON.stringify(fullClearDates));
    }

    function getTodayStatus() {
      const today = getTodayKey();
      return data[today] || {};
    }

    function setClear(id, value) {
      const today = getTodayKey();
      if (!data[today]) data[today] = {};
      data[today][id] = value;
      checkAllClear();
      saveData();
      render();
    }

    function toggle(id) {
      const status = getTodayStatus();
      setClear(id, !status[id]);
    }

    function checkAllClear() {
      const today = getTodayKey();
      const status = data[today] || {};
      const all = MISSIONS.every(m => status[m.id] === true);
      if (all && !fullClearDates.includes(today)) {
        fullClearDates.push(today);
        saveData();
      } else if (!all && fullClearDates.includes(today)) {
        fullClearDates = fullClearDates.filter(d => d !== today);
        saveData();
      }
    }

    // ========== 他アプリ同期 ==========
    function syncFromOtherApps() {
      const today = getTodayKey();
      let updated = 0;

      // 英単語 (dailyStats)
      try {
        const stats = JSON.parse(localStorage.getItem("dailyStats") || "{}");
        if (stats[today] >= 30) {
          if (!data[today].word) { data[today].word = true; updated++; }
        }
      } catch(e) {}

      // 体重 (weights)
      try {
        const weights = JSON.parse(localStorage.getItem("weights") || "[]");
        if (weights.some(w => w.date === today)) {
          if (!data[today].weight) { data[today].weight = true; updated++; }
        }
      } catch(e) {}

      // 水 (mizumizuRecords) 6杯 = 1.5L
      try {
        const records = JSON.parse(localStorage.getItem("mizumizuRecords") || "{}");
        if ((records[today] || 0) >= 6) {
          if (!data[today].water) { data[today].water = true; updated++; }
        }
      } catch(e) {}

      // 筋トレ (grokCompleted)
      try {
        const completed = JSON.parse(localStorage.getItem("grokCompleted") || "[]");
        if (completed.includes(today)) {
          if (!data[today].training) { data[today].training = true; updated++; }
        }
      } catch(e) {}

      // 薬 (medRecords) 朝＋夜両方
　　　try {
 　　　 const med = JSON.parse(localStorage.getItem("medRecords") || "{}");
 　　　 if (med[today]?.morning && med[today]?.evening) {
   　　　　 if (!data[today].med) { data[today].med = true; updated++; }
 　　　　 }
　　　} catch(e) {}

      checkAllClear();
      saveData();
      render();
      alert(updated > 0 ? `${updated}個のミッションを自動でクリアにしたぞ。` : "同期できる新しい記録はなかったな。");
    }

    // ========== レンダリング ==========
    function render() {
      const today = getTodayKey();
      const status = getTodayStatus();
      const clearedCount = MISSIONS.filter(m => status[m.id]).length;

      document.getElementById("todayDate").textContent = today.replace(/-/g, "/") + "（今日）";
      document.getElementById("progressNum").textContent = clearedCount;

      const banner = document.getElementById("allClearBanner");
      if (clearedCount === 6) banner.classList.add("show");
      else banner.classList.remove("show");

      const list = document.getElementById("missionList");
      list.innerHTML = "";
      MISSIONS.forEach(m => {
        const isClear = !!status[m.id];
        const div = document.createElement("div");
        div.className = "mission" + (isClear ? " cleared" : "");
        div.innerHTML = `
          <div class="mission-info">
            <div class="mission-name">${m.name}</div>
            ${m.link ? `<a class="mission-link" href="${m.link}" target="_blank">アプリを開く →</a>` : ""}
          </div>
          <div class="status ${isClear ? "cleared" : "uncleared"}">
            ${isClear ? "クリア" : "未クリア"}
          </div>
          <button class="toggle-btn" onclick="toggle('${m.id}')">
            ${isClear ? "取消" : "クリア"}
          </button>
        `;
        list.appendChild(div);
      });

      renderCalendar();
    }

    // ========== カレンダー ==========
    function renderCalendar() {
  const grid = document.getElementById("calGrid");
  grid.innerHTML = "";

  const dayNames = ["日","月","火","水","木","金","土"];
  dayNames.forEach(d => {
    const el = document.createElement("div");
    el.className = "cal-day-name";
    el.textContent = d;
    grid.appendChild(el);
  });

  const first = new Date(calYear, calMonth, 1);
  const last = new Date(calYear, calMonth + 1, 0);
  const startDay = first.getDay();
  const daysInMonth = last.getDate();
  const todayKey = getTodayKey();

  document.getElementById("calTitle").textContent = `${calYear}年${calMonth+1}月`;

  // 空白セル
  for (let i = 0; i < startDay; i++) {
    const empty = document.createElement("div");
    empty.className = "cal-day empty";
    grid.appendChild(empty);
  }

  for (let d = 1; d <= daysInMonth; d++) {
    const key = `${calYear}-${String(calMonth+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
    const el = document.createElement("div");
    el.className = "cal-day";

    // その日のクリア数を計算
    const dayData = data[key] || {};
    const cleared = MISSIONS.filter(m => dayData[m.id] === true).length;
    const total = MISSIONS.length; // 7

    // 日付 + 下にスコア
    if (cleared > 0) {
      el.innerHTML = `
        <div class="day-num">${d}</div>
        <div class="day-score">${cleared}/${total}</div>
      `;
    } else {
      el.innerHTML = `<div class="day-num">${d}</div>`;
    }

    if (key === todayKey) el.classList.add("today");
    if (cleared === total) el.classList.add("full");

    grid.appendChild(el);
  }
}

    // ========== コメント ==========
    function showComment() {
      const status = getTodayStatus();
      const count = MISSIONS.filter(m => status[m.id]).length;
      const list = COMMENTS[count] || COMMENTS[0];
      const text = list[Math.floor(Math.random() * list.length)];
      document.getElementById("commentText").textContent = text;
      document.getElementById("commentModal").classList.add("show");
    }

    function closeComment() {
      document.getElementById("commentModal").classList.remove("show");
    }

    function resetToday() {
      if (!confirm("今日の記録を全部未クリアに戻すぞ。いいな？")) return;
      const today = getTodayKey();
      data[today] = {};
      MISSIONS.forEach(m => data[today][m.id] = false);
      fullClearDates = fullClearDates.filter(d => d !== today);
      saveData();
      render();
    }

    // ========== 初期化 ==========
    (function init() {
      const now = new Date();
      calYear = now.getFullYear();
      calMonth = now.getMonth();
      loadData();
      // 起動時に一度自動同期を試みる
      setTimeout(() => {
        // 静かに同期（アラートなし）
        const today = getTodayKey();
        try {
          const stats = JSON.parse(localStorage.getItem("dailyStats") || "{}");
          if (stats[today] >= 30) data[today].word = true;
        } catch(e) {}
        try {
          const weights = JSON.parse(localStorage.getItem("weights") || "[]");
          if (weights.some(w => w.date === today)) data[today].weight = true;
        } catch(e) {}
        try {
          const records = JSON.parse(localStorage.getItem("mizumizuRecords") || "{}");
          if ((records[today] || 0) >= 6) data[today].water = true;
        } catch(e) {}
        try {
          const completed = JSON.parse(localStorage.getItem("grokCompleted") || "[]");
          if (completed.includes(today)) data[today].training = true;
        } catch(e) {}
        try {
  　　　const med = JSON.parse(localStorage.getItem("medRecords") || "{}");
  　　　if (med[today]?.morning && med[today]?.evening) data[today].med = true;
　　　　} catch(e) {}
        checkAllClear();
        saveData();
        render();
      }, 100);
      render();
    })();
  </script>
